# Netlify configuration for a static, no-build site.
# The repo root is published as-is — there is no build step.

[build]
  publish = "."
  command = ""

# Sensible security headers for a public portfolio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
